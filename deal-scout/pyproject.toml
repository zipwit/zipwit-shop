[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-scout"
version = "0.1.0"
description = "Collect product data for the Zipwit catalog"
requires-python = "==3.15.2"
dependencies = [
    "crawlee[beautifulsoup]>=1.11,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
]

[project.scripts]
zipwit-crawl = "deal_scout.crawl:main"
zipwit-deals = "deal_scout.pipeline:main"

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "ty==0.0.99",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
extend-select = ["ASYNC", "B", "C90", "I", "RUF", "SIM", "UP"]
