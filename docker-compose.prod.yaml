name: zipwit

x-app-env: &app-env
  env_file:
    - .env.production
  environment:
    NODE_ENV: production
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: zipwit
    PGDATABASE: zipwit
    PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
    REDIS_CLUSTER_NODES: redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379

x-redis-node: &redis-node
  image: redis:8.10.3-alpine
  restart: unless-stopped
  configs:
    - source: redis-cluster-config
      target: /etc/redis/cluster.conf
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardened: &hardened
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:19.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zipwit
      POSTGRES_DB: zipwit
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipwit -d zipwit"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis-1:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-1",
      ]
    volumes:
      - redis1data:/data

  redis-2:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-2",
      ]
    volumes:
      - redis2data:/data

  redis-3:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-3",
      ]
    volumes:
      - redis3data:/data

  redis-cluster-init:
    image: redis:8.10.3-alpine
    entrypoint: ["sh", "/redis-cluster-init.sh"]
    configs:
      - source: redis-cluster-init-script
        target: /redis-cluster-init.sh
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      target: migrate
    <<: [*app-env, *hardened]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    <<: [*app-env, *hardened]
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/ready || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  deal-scout:
    profiles: ["tools"]
    build:
      context: .
      target: deal-scout
    <<: [*app-env, *hardened]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully

  checkout-notifications:
    build:
      context: .
      target: migrate
    <<: [*app-env, *hardened]
    command: ["pnpm", "checkout:notifications"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) ))" -lt 120
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./certs/fullchain.pem
        target: /etc/nginx/certs/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: ./certs/privkey.pem
        target: /etc/nginx/certs/privkey.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  redis1data:
  redis2data:
  redis3data:

configs:
  redis-cluster-config:
    file: ./docker/redis-cluster.conf
  redis-cluster-init-script:
    file: ./docker/redis-cluster-init.sh
