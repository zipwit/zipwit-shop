name: zipwit

x-app-env: &app-env
  env_file:
    - .env.production
  environment:
    NODE_ENV: production
    DB_HOST: db
    DB_PORT: "5432"
    DB_SSL: "true"
    DB_SSL_SERVERNAME: ${DB_SSL_SERVERNAME:?DB_SSL_SERVERNAME is required}
    REDIS_CLUSTER_NODES: redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379

x-redis-node: &redis-node
  image: redis:8.10.2-alpine
  restart: unless-stopped
  configs:
    - source: redis-cluster-config
      target: /etc/redis/cluster.conf
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/fullchain.pem
      - -c
      - ssl_key_file=/etc/postgresql/certs/privkey.pem
    volumes:
      - pgdata:/var/lib/postgresql
      - type: bind
        source: ./certs/fullchain.pem
        target: /etc/postgresql/certs/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: ./certs/privkey.pem
        target: /etc/postgresql/certs/privkey.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-1:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-1",
      ]
    volumes:
      - redis1data:/data

  redis-2:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-2",
      ]
    volumes:
      - redis2data:/data

  redis-3:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-3",
      ]
    volumes:
      - redis3data:/data

  redis-cluster-init:
    image: redis:8.10.2-alpine
    entrypoint: ["sh", "/redis-cluster-init.sh"]
    configs:
      - source: redis-cluster-init-script
        target: /redis-cluster-init.sh
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      target: migrate
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
    <<: *app-env
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  checkout-notifications:
    build:
      context: .
      target: migrate
    <<: *app-env
    command: ["pnpm", "checkout:notifications"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./certs/fullchain.pem
        target: /etc/nginx/certs/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: ./certs/privkey.pem
        target: /etc/nginx/certs/privkey.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  redis1data:
  redis2data:
  redis3data:

configs:
  redis-cluster-config:
    file: ./docker/redis-cluster.conf
  redis-cluster-init-script:
    file: ./docker/redis-cluster-init.sh
