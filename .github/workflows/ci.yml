name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: docker-compose.cluster-test.yaml
      DB_HOST: 127.0.0.1
      DB_PORT: "15439"
      DB_NAME: zipwit_catalog_test
      DB_USER: catalog_test
      DB_PASSWORD: catalog_test
      DB_SSL: "false"
      REDIS_CLUSTER_NODES: redis://127.0.0.1:17379,redis://127.0.0.1:17380,redis://127.0.0.1:17381
      BETTER_AUTH_SECRET: ci-cluster-check-only-not-a-production-secret

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm check:deprecations

      - run: pnpm knip

      - run: pnpm build

      - name: Start disposable PostgreSQL and three-node Redis Cluster
        run: |
          docker compose up -d --wait db redis-1 redis-2 redis-3
          # Blocks until cluster creation finishes; fails the step on a non-zero exit.
          docker compose run --rm redis-cluster-init
          for port in 17379 17380 17381; do
            ok=
            for i in $(seq 1 30); do
              if docker compose exec -T redis-1 redis-cli -p "$port" cluster info \
                | tr -d '\r' | grep -q '^cluster_state:ok$'; then ok=1; break; fi
              sleep 1
            done
            [ -n "$ok" ] || { echo "node $port never reported cluster_state:ok"; exit 1; }
          done

      - run: pnpm search:check

      - run: pnpm db:migrate
        if: ${{ hashFiles('drizzle/**/migration.sql') != '' }}

      - run: pnpm catalog:check

      - name: Debug cluster
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=50 db redis-1 redis-2 redis-3
          docker compose exec -T redis-1 redis-cli -p 17379 cluster nodes || true

      - name: Stop test services
        if: always()
        run: docker compose down
