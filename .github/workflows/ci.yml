name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deal-scout:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19.0-alpine
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: zipwit_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/zipwit_test
    defaults:
      run:
        working-directory: deal-scout
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.13.6
      - run: uv sync --locked
      - run: uv run --locked ty check --project ..
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -v

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19.0-alpine
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: zipwit_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 15

    env:
      DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/zipwit_test
      TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/zipwit_test
      COMPOSE_FILE: docker-compose.cluster-test.yaml
      REDIS_CLUSTER_NODES: redis://127.0.0.1:17379,redis://127.0.0.1:17380,redis://127.0.0.1:17381
      BETTER_AUTH_SECRET: ci-cluster-check-only-not-a-production-secret

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check that generated routes are committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - run: pnpm verify

      - run: pnpm check:deprecations

      - run: pnpm knip

      - name: Start disposable three-node Redis Cluster
        run: |
          docker compose up -d --wait redis-1 redis-2 redis-3
          docker compose run --rm redis-cluster-init
          for port in 17379 17380 17381; do
            ok=
            for i in $(seq 1 30); do
              if docker compose exec -T redis-1 redis-cli -p "$port" cluster info \
                | tr -d '\r' | grep -q '^cluster_state:ok$'; then ok=1; break; fi
              sleep 1
            done
            [ -n "$ok" ] || { echo "node $port never reported cluster_state:ok"; exit 1; }
          done

      - run: pnpm search:check

      - run: pnpm db:migrate

      - run: pnpm catalog:check

      - run: node --import tsx scripts/cart-check.ts

      - name: Prepare worker for the storefront integration test
        run: |
          pipx install uv==0.13.6
          uv sync --locked --project deal-scout

      - name: Smoke test the built storefront and migration gate
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: "18339"
          BETTER_AUTH_URL: http://127.0.0.1:18339
          RESEND_API_KEY: re_ci_fixture
          DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/zipwit_smoke
        run: |
          PGPASSWORD=fixture createdb -h 127.0.0.1 -U postgres zipwit_smoke
          node .output/server/index.mjs &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS "$BETTER_AUTH_URL/api/health" -o /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BETTER_AUTH_URL/api/ready")" = 503
          pnpm db:migrate
          curl -fsS "$BETTER_AUTH_URL/api/ready" -o /dev/null
          curl -fsS -H 'Cookie: zipwit-locale=en' "$BETTER_AUTH_URL/checkout" -o "$RUNNER_TEMP/checkout.html"
          grep -q 'Sign in to save your delivery address' "$RUNNER_TEMP/checkout.html"
          SCOUT_TEST_STOREFRONT="$BETTER_AUTH_URL" deal-scout/.venv/bin/python -m unittest discover -s deal-scout/tests -p test_storefront.py -v

      - name: Debug cluster
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=50 redis-1 redis-2 redis-3
          docker compose exec -T redis-1 redis-cli -p 17379 cluster nodes || true

      - name: Stop test services
        if: always()
        run: docker compose down
