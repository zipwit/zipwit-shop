name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "15439"
      DB_NAME: zipwit_catalog_test
      DB_USER: catalog_test
      DB_PASSWORD: catalog_test
      DB_SSL: "false"
      REDIS_CLUSTER_NODES: redis://127.0.0.1:17379,redis://127.0.0.1:17380,redis://127.0.0.1:17381
      BETTER_AUTH_SECRET: ci-cluster-check-only-not-a-production-secret

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm check:deprecations

      - run: pnpm knip

      - run: pnpm build

      - name: Start disposable PostgreSQL and three-node Redis Cluster
        run: docker compose -f docker-compose.cluster-test.yaml up -d --wait

      - run: pnpm search:check

      - run: pnpm db:migrate
        if: ${{ hashFiles('drizzle/**/migration.sql') != '' }}

      - run: pnpm catalog:check

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.cluster-test.yaml down
