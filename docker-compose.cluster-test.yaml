name: zipwit-cluster-check

x-node: &node
  image: redis:8.10.3-alpine
  network_mode: host
  tmpfs:
    - /data:uid=999,gid=999
  configs:
    - source: cluster-test-config
      target: /etc/redis/cluster.conf
  healthcheck:
    test: ["CMD-SHELL", 'redis-cli -p "$${REDIS_TEST_PORT}" ping']
    interval: 2s
    timeout: 3s
    retries: 15

services:
  redis-1:
    <<: *node
    environment:
      REDIS_TEST_PORT: "17379"
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--bind",
        "127.0.0.1",
        "--port",
        "17379",
        "--cluster-announce-ip",
        "127.0.0.1",
        "--cluster-announce-port",
        "17379",
        "--cluster-preferred-endpoint-type",
        "ip",
      ]

  redis-2:
    <<: *node
    environment:
      REDIS_TEST_PORT: "17380"
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--bind",
        "127.0.0.1",
        "--port",
        "17380",
        "--cluster-announce-ip",
        "127.0.0.1",
        "--cluster-announce-port",
        "17380",
        "--cluster-preferred-endpoint-type",
        "ip",
      ]

  redis-3:
    <<: *node
    environment:
      REDIS_TEST_PORT: "17381"
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--bind",
        "127.0.0.1",
        "--port",
        "17381",
        "--cluster-announce-ip",
        "127.0.0.1",
        "--cluster-announce-port",
        "17381",
        "--cluster-preferred-endpoint-type",
        "ip",
      ]

  redis-cluster-init:
    image: redis:8.10.3-alpine
    network_mode: host
    entrypoint:
      [
        "redis-cli",
        "--cluster",
        "create",
        "127.0.0.1:17379",
        "127.0.0.1:17380",
        "127.0.0.1:17381",
        "--cluster-replicas",
        "0",
        "--cluster-yes",
      ]
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy

configs:
  cluster-test-config:
    file: ./docker/redis-cluster.conf
