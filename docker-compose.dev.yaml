name: zipwit-dev

x-app-env: &app-env
  env_file:
    - .env.development
  environment:
    NODE_ENV: development
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: zipwit
    PGDATABASE: zipwit
    PGPASSWORD: "${POSTGRES_PASSWORD:-zipwit_dev}"
    REDIS_CLUSTER_NODES: redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379
    BETTER_AUTH_URL: http://localhost:3000
    SITE_URL: http://localhost:3000

x-redis-node: &redis-node
  image: redis:8.10.3-alpine
  restart: unless-stopped
  configs:
    - source: redis-cluster-config
      target: /etc/redis/cluster.conf
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:19.0-alpine
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: zipwit
      POSTGRES_DB: zipwit
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-zipwit_dev}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipwit -d zipwit"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis-1:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-1",
      ]
    volumes:
      - redis1data:/data

  redis-2:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-2",
      ]
    volumes:
      - redis2data:/data

  redis-3:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-3",
      ]
    volumes:
      - redis3data:/data

  redis-cluster-init:
    image: redis:8.10.3-alpine
    entrypoint: ["sh", "/redis-cluster-init.sh"]
    configs:
      - source: redis-cluster-init-script
        target: /redis-cluster-init.sh
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      target: dev
    <<: *app-env
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: dev
    <<: *app-env
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully

  deal-scout:
    profiles: ["tools"]
    build:
      context: .
      target: deal-scout
    <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully

  checkout-notifications:
    build:
      context: .
      target: dev
    <<: *app-env
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    command: ["pnpm", "checkout:notifications"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:1.31.8-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - type: bind
        source: ./nginx.dev.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      - app

volumes:
  postgres-data:
  redis1data:
  redis2data:
  redis3data:
  node_modules:

configs:
  redis-cluster-config:
    file: ./docker/redis-cluster.conf
  redis-cluster-init-script:
    file: ./docker/redis-cluster-init.sh
