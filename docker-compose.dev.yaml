name: zipwit-dev

x-app-env: &app-env
  env_file:
    - .env.development
  environment:
    NODE_ENV: development
    DB_HOST: db
    DB_PORT: "5432"
    DB_SSL: "false"
    REDIS_CLUSTER_NODES: redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379
    BETTER_AUTH_URL: http://localhost:3000
    SITE_URL: http://localhost:3000

x-redis-node: &redis-node
  image: redis:8.10.2-alpine
  restart: unless-stopped
  configs:
    - source: redis-cluster-config
      target: /etc/redis/cluster.conf
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-1:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-1",
      ]
    volumes:
      - redis1data:/data

  redis-2:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-2",
      ]
    volumes:
      - redis2data:/data

  redis-3:
    <<: *redis-node
    command:
      [
        "redis-server",
        "/etc/redis/cluster.conf",
        "--cluster-announce-hostname",
        "redis-3",
      ]
    volumes:
      - redis3data:/data

  redis-cluster-init:
    image: redis:8.10.2-alpine
    entrypoint: ["sh", "/redis-cluster-init.sh"]
    configs:
      - source: redis-cluster-init-script
        target: /redis-cluster-init.sh
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      target: dev
    <<: *app-env
    command: ["pnpm", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: dev
    <<: *app-env
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully

  checkout-notifications:
    build:
      context: .
      target: dev
    <<: *app-env
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    command: ["pnpm", "checkout:notifications"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - type: bind
        source: ./nginx.dev.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      - app

volumes:
  pgdata:
  redis1data:
  redis2data:
  redis3data:
  node_modules:

configs:
  redis-cluster-config:
    file: ./docker/redis-cluster.conf
  redis-cluster-init-script:
    file: ./docker/redis-cluster-init.sh
